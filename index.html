<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador One Piece TCG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B4%E2%80%8D%E2%98%A0%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="setup" class="screen">
    <h1>🏴‍☠️ Simulador de One Piece Card Game</h1>
    <p class="subtitle">Starter Decks oficiales · 1v1 contra un bot · cartas de OPTCG API</p>
    <h2>Tu mazo</h2>
    <div id="myDecks" class="deck-grid"></div>
    <h2>Mazo del bot</h2>
    <div id="botDecks" class="deck-grid"></div>
    <button id="startBtn" class="primary" disabled>¡Zarpar!</button>
    <button id="sandboxBtn" title="Modo pruebas: rival pasivo, DON!! de sobra y cualquier carta del catálogo en tu mano">🧪 Sandbox</button>
    <button id="matBtnSetup" title="Elegir tapete">🎨 Tapete</button>

    <h2>🌐 Jugar online (1v1 con un amigo)</h2>
    <p class="subtitle">Elige arriba TU mazo, pon tu nombre y crea una sala — o únete con el código de tu amigo.</p>
    <div id="onlinePanel">
      <input id="onName" placeholder="Tu nombre" maxlength="16">
      <button id="onCreate">⚓ Crear sala</button>
      <span class="onSep">o</span>
      <input id="onCode" placeholder="CÓDIGO" maxlength="4" style="text-transform:uppercase">
      <button id="onJoin">Unirse</button>
      <details id="onAdv"><summary>Servidor</summary>
        <input id="onServer" placeholder="ws://localhost:8765">
      </details>
      <div id="onStatus"></div>
    </div>
  </div>

  <div id="game" class="screen hidden">
    <div id="topbar">
      <span id="turnInfo"></span>
      <span id="promptText"></span>
      <span id="promptButtons"></span>
      <span id="speedSel" title="Velocidad del bot">
        <button data-sp="1.8">🐢</button>
        <button data-sp="1" class="on">▶</button>
        <button data-sp="0.5">⏩</button>
      </span>
      <button id="logToggle" title="Registro">📜</button>
      <button id="matBtn" title="Elegir tapete">🎨</button>
      <span id="sandboxBar" class="hidden">
        <button id="sbAddCard" title="Buscar cualquier carta del catálogo y añadirla a tu mano">➕ Carta</button>
        <button id="sbDraw" title="Robar 1 carta">🃏 Robar</button>
        <button id="sbDon" title="+2 DON!! activos">🔶 +DON</button>
        <button id="sbLife" title="+1 carta de Vida (del mazo)">❤️ +Vida</button>
      </span>
    </div>
    <div id="banner" class="hidden"></div>
    <div id="table">
      <div id="oppArea" class="side"></div>
      <div id="midRow"></div>
      <div id="selfArea" class="side"></div>
      <div id="hand"></div>
    </div>
    <div id="log"></div>
    <div id="preview"></div>
    <svg id="fxLayer"></svg>
    <div id="overlay" class="hidden"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
